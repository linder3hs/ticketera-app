name: ci-cd

# Pull requests: CI only. Push to main: CI, then build, migrate and deploy to the EC2 instance.
# Rollback: run this workflow by hand (Actions > ci-cd > Run workflow) with the image tag (commit SHA) to redeploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      sha:
        description: Image tag (commit SHA) to redeploy, skips the build
        required: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  ci:
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Offline (no DATABASE_URL): fails if src/db/schema changed without its committed migration.
      - name: Migrations in sync with the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema changed without its migration. Run npm run db:generate and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi
      - run: npx vitest run

  deploy:
    needs: ci
    # `ci` is skipped on a manual redeploy; the deploy still runs then.
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        if: inputs.sha == ''
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: inputs.sha == ''

      - name: Build and push the app image
        if: inputs.sha == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO }}:${{ env.TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build and push the migrate image
        if: inputs.sha == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO }}:${{ env.TAG }}-migrate
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Deploy on the instance (SSM Run Command)
        run: |
          SCRIPT=$(base64 -w0 deploy/deploy.sh)
          jq -n --arg c "echo $SCRIPT | base64 -d > /opt/ticketera/deploy.sh && bash /opt/ticketera/deploy.sh $TAG" \
            '{commands: [$c], executionTimeout: ["900"]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "Command $CMD_ID"
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ] || { echo "Deploy finished with status $STATUS"; exit 1; }

      - name: Smoke test through CloudFront
        run: |
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors -sS "https://${{ vars.APP_HOST }}/api/health"
          curl --fail --retry 5 --retry-delay 6 --retry-all-errors -sS -o /dev/null -w "home: HTTP %{http_code}\n" "https://${{ vars.APP_HOST }}/"
